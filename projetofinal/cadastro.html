<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Conectadas — Cadastrar Pet para Adoção</title>
    <meta name="description" content="Página de Cadastro do Site Patinhas Conectadas - Doações responsáveis de pets.">
    <meta name="author" content="Paulo Fagundes">

    <!-- 1. Ícone do Site (Favicon) -->
    <link rel="icon" href="imagens/icone.ico" type="image/x-icon"> 
    
    <!-- Meta Tags do Open Graph -->
    <meta property="og:title" content="Patinhas Conectadas — Encontre seu novo amigo">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://fagundespauloroberto.github.io/wdd231/projetofinal/imagens/patinhas_conectadas.webp">
    <meta property="og:url" content="https://fagundespauloroberto.github.io/wdd231/projetofinal/index.html">
    <meta property="og:description" content="Página Inicial do Site Patinhas Conectadas - Doações responsáveis de pets.">      

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- Exatamente 2 arquivos CSS -->
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="stylesheet" href="estilos/cadastro.css">    
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="scripts/cadastro.js" defer></script>
</head>
<body>

    <!-- Navegação -->
    <header class="navbar">
        <div class="site-container nav-container">
            <a href="index.html" class="logo">Patinhas Conectadas 🐾</a>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="cadastro.html" class="active">Cadastrar Pet</a>
                <a href="meus-pets.html">Meus Pets 🐾</a>
                <span id="userEmailNav" class="user-email-badge"></span>
                <button id="btnSair" class="btn-secundario">Sair</button>
            </nav>
        </div>
    </header>

    <main class="site-container main-cadastro">
        <div class="card-form">
            <h1>Cadastrar Novo Pet</h1>
            
            <!-- Caixa do Doador Logado -->
            <div class="info-doador-logado">
                <p>👤 <strong>Doador Responsável:</strong> <span id="nomeDoadorLogado">Verificando login...</span></p>
            </div>

            <form id="formAnimal">
                <div class="campo-formulario">
                    <label for="animalNome">Nome do Pet *</label>
                    <input type="text" id="animalNome" required placeholder="Ex: Rex, Thor, Miau">
                </div>

                <div class="campo-formulario">
                    <label for="animalEspecie">Espécie *</label>
                    <select id="animalEspecie" required>
                        <option value="">Selecione...</option>
                        <option value="Cão">Cão</option>
                        <option value="Gato">Gato</option>
                        <option value="Roedor">Roedores</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="animalPorte">Porte *</label>
                    <select id="animalPorte" required>
                        <option value="">Selecione...</option>
                        <option value="Pequeno">Pequeno</option>
                        <option value="Médio">Médio</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="animalIdade">Idade Aproximada *</label>
                    <input type="text" id="animalIdade" required placeholder="Ex: 2 meses, 1 ano, idoso">
                </div>

                <div class="campo-formulario">
                    <label for="animalStatus">Status de Adoção *</label>
                    <select id="animalStatus" required>
                        <option value="" disabled selected>Selecione o status...</option>
                        <option value="Disponível">Disponível</option>
                        <option value="Em Processo">Em Processo</option>
                        <option value="Adotado">Adotado</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="animalFoto">Foto do Pet *</label>
                    <input type="file" id="animalFoto" accept="image/*" required>
                </div>

                <div class="campo-formulario">
                    <label for="animalDescricao">História / Descrição *</label>
                    <textarea id="animalDescricao" rows="4" required placeholder="Conte um pouco sobre o comportamento do pet, vacinas, se é castrado, etc."></textarea>
                </div>

                <button type="submit" class="btn-cadastrar">Cadastrar Pet</button>
            </form>
        </div>
    </main>

</body>
</html>
